services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-manager-backend
    ports:
      - "8000:8000"
    volumes:
      - video_storage:/app/storage   # persists uploaded/processed files across restarts
    environment:
      - ENV=production
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    # --- GPU passthrough ---
    # Requires nvidia-container-toolkit installed on the host.
    # The app detects the GPU at startup and falls back to CPU automatically
    # if this block is removed or the host has no NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - video-manager-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-manager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - video-manager-net

networks:
  video-manager-net:
    driver: bridge

volumes:
  video_storage:
