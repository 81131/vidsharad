services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-manager-backend
    ports:
      - "8000:8000"
    volumes:
      - video_storage:/app/storage   # persists uploaded/processed files across restarts
    environment:
      - ENV=production
    restart: unless-stopped
    networks:
      - video-manager-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video-manager-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - video-manager-net

networks:
  video-manager-net:
    driver: bridge

volumes:
  video_storage:
